name: Cancel dequeued merge-group run

on:
    pull_request:
        types: [dequeued]

permissions:
    actions: write

jobs:
    cancel:
        name: Cancel this PR's merge-group run
        runs-on: ubuntu-latest
        steps:
            - env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  QUEUE_PREFIX: gh-readonly-queue/${{ github.event.pull_request.base.ref }}/pr-${{ github.event.pull_request.number }}-
              run: |
                  gh run list --workflow "PR Checks" --event merge_group --limit 50 --json databaseId,headBranch,status \
                      -q ".[] | select(.status != \"completed\" and (.headBranch | startswith(\"${QUEUE_PREFIX}\"))) | .databaseId" \
                    | tee /dev/stderr | xargs -r -n1 gh run cancel
